<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="sd-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181310"/>
      <stop offset="50%" stop-color="#241b14"/>
      <stop offset="100%" stop-color="#120e0b"/>
    </linearGradient>
    <radialGradient id="sd-glow" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#c2632b" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#c2632b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#sd-bg)"/>
  <rect width="800" height="500" fill="url(#sd-glow)"/>

  <!-- Blueprint Grid -->
  <g opacity="0.12">
    <line x1="0" y1="120" x2="800" y2="120" stroke="#d4a373" stroke-dasharray="3 3"/>
    <line x1="0" y1="240" x2="800" y2="240" stroke="#d4a373" stroke-dasharray="3 3"/>
    <line x1="0" y1="360" x2="800" y2="360" stroke="#d4a373" stroke-dasharray="3 3"/>
    <line x1="200" y1="0" x2="200" y2="500" stroke="#d4a373" stroke-dasharray="3 3"/>
    <line x1="400" y1="0" x2="400" y2="500" stroke="#d4a373" stroke-dasharray="3 3"/>
    <line x1="600" y1="0" x2="600" y2="500" stroke="#d4a373" stroke-dasharray="3 3"/>
  </g>

  <!-- Service Desk Interface Frame -->
  <g transform="translate(70, 70)">
    <rect width="660" height="360" rx="12" fill="#1e1814" stroke="#c2632b" stroke-opacity="0.4" stroke-width="1.5"/>
    
    <!-- Title Bar -->
    <rect width="660" height="38" rx="12" fill="#2a201a"/>
    <circle cx="24" cy="19" r="5" fill="#e06c75"/>
    <circle cx="42" cy="19" r="5" fill="#e5c07b"/>
    <circle cx="60" cy="19" r="5" fill="#98c379"/>
    <text x="90" y="24" fill="#d4a373" font-family="monospace" font-size="11" font-weight="600">SELAMNEW SERVICE DESK (SD) // ITSM &amp; SLA ENGINE</text>

    <!-- Top Telemetry Row -->
    <g transform="translate(24, 52)">
      <!-- Metric 1 -->
      <rect x="0" y="0" width="190" height="60" rx="8" fill="#251c16" stroke="#4a3528" stroke-width="1"/>
      <text x="14" y="20" fill="#a89283" font-family="monospace" font-size="9">SLA COMPLIANCE RATE</text>
      <text x="14" y="44" fill="#34d399" font-family="sans-serif" font-size="18" font-weight="700">99.4%</text>
      <text x="120" y="42" fill="#34d399" font-family="monospace" font-size="9">TARGET MET</text>

      <!-- Metric 2 -->
      <rect x="210" y="0" width="190" height="60" rx="8" fill="#251c16" stroke="#c2632b" stroke-opacity="0.6" stroke-width="1"/>
      <text x="224" y="20" fill="#a89283" font-family="monospace" font-size="9">AVG RESOLUTION TIME</text>
      <text x="224" y="44" fill="#f5c29f" font-family="sans-serif" font-size="18" font-weight="700">1.8 hrs</text>
      <text x="320" y="42" fill="#e08244" font-family="monospace" font-size="9">-65% MTTR</text>

      <!-- Metric 3 -->
      <rect x="420" y="0" width="192" height="60" rx="8" fill="#251c16" stroke="#4a3528" stroke-width="1"/>
      <text x="434" y="20" fill="#a89283" font-family="monospace" font-size="9">TICKETS RESOLVED</text>
      <text x="434" y="44" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="700">2,480+</text>
      <text x="540" y="42" fill="#34d399" font-family="monospace" font-size="9">Q3/Q4</text>
    </g>

    <!-- Ticket Queue Table -->
    <g transform="translate(24, 130)">
      <text x="4" y="16" fill="#d4a373" font-family="monospace" font-size="11" font-weight="700">INCIDENT &amp; SERVICE REQUEST QUEUE (AUTOMATED DISPATCH)</text>
      
      <!-- Table Header -->
      <rect x="0" y="28" width="612" height="28" rx="4" fill="#291f19"/>
      <text x="16" y="46" fill="#a89283" font-family="monospace" font-size="9">TICKET ID</text>
      <text x="100" y="46" fill="#a89283" font-family="monospace" font-size="9">INCIDENT SUMMARY</text>
      <text x="310" y="46" fill="#a89283" font-family="monospace" font-size="9">SEVERITY / SLA</text>
      <text x="450" y="46" fill="#a89283" font-family="monospace" font-size="9">ASSIGNED TIER</text>
      <text x="550" y="46" fill="#a89283" font-family="monospace" font-size="9">STATUS</text>

      <!-- Row 1 -->
      <rect x="0" y="62" width="612" height="34" rx="4" fill="#211913" stroke="#3d2c21" stroke-width="0.8"/>
      <text x="16" y="83" fill="#f5c29f" font-family="monospace" font-size="9" font-weight="700">#SD-4092</text>
      <text x="100" y="83" fill="#f0ebe6" font-family="sans-serif" font-size="10">Core Router Gateway Failover</text>
      <rect x="310" y="72" width="55" height="16" rx="3" fill="#e06c75" fill-opacity="0.25"/>
      <text x="316" y="84" fill="#f87171" font-family="monospace" font-size="8">P1 CRITICAL</text>
      <text x="450" y="83" fill="#d4a373" font-family="monospace" font-size="9">NOC L3 Eng</text>
      <rect x="548" y="72" width="50" height="16" rx="3" fill="#34d399" fill-opacity="0.2"/>
      <text x="554" y="84" fill="#34d399" font-family="monospace" font-size="8">RESOLVED</text>

      <!-- Row 2 -->
      <rect x="0" y="102" width="612" height="34" rx="4" fill="#211913" stroke="#3d2c21" stroke-width="0.8"/>
      <text x="16" y="123" fill="#f5c29f" font-family="monospace" font-size="9" font-weight="700">#SD-4093</text>
      <text x="100" y="123" fill="#f0ebe6" font-family="sans-serif" font-size="10">SSO Enterprise Domain Sync</text>
      <rect x="310" y="112" width="55" height="16" rx="3" fill="#e5c07b" fill-opacity="0.2"/>
      <text x="318" y="124" fill="#fbbf24" font-family="monospace" font-size="8">P2 HIGH</text>
      <text x="450" y="123" fill="#d4a373" font-family="monospace" font-size="9">IAM Platform</text>
      <rect x="548" y="112" width="50" height="16" rx="3" fill="#60a5fa" fill-opacity="0.2"/>
      <text x="555" y="124" fill="#93c5fd" font-family="monospace" font-size="8">ACTIVE</text>

      <!-- Row 3 -->
      <rect x="0" y="142" width="612" height="34" rx="4" fill="#211913" stroke="#3d2c21" stroke-width="0.8"/>
      <text x="16" y="163" fill="#f5c29f" font-family="monospace" font-size="9" font-weight="700">#SD-4094</text>
      <text x="100" y="163" fill="#f0ebe6" font-family="sans-serif" font-size="10">New Department Workspace Provisioning</text>
      <rect x="310" y="152" width="55" height="16" rx="3" fill="#98c379" fill-opacity="0.2"/>
      <text x="320" y="164" fill="#a3e635" font-family="monospace" font-size="8">P3 MED</text>
      <text x="450" y="163" fill="#d4a373" font-family="monospace" font-size="9">Admin Ops</text>
      <rect x="548" y="152" width="50" height="16" rx="3" fill="#34d399" fill-opacity="0.2"/>
      <text x="554" y="164" fill="#34d399" font-family="monospace" font-size="8">RESOLVED</text>
    </g>
  </g>
</svg>
