<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="fleet-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a120c"/>
      <stop offset="50%" stop-color="#2a1d15"/>
      <stop offset="100%" stop-color="#0e0a07"/>
    </linearGradient>
    <radialGradient id="fleet-glow" cx="60%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fleet-path" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#fleet-bg)"/>
  <rect width="800" height="500" fill="url(#fleet-glow)"/>
  
  <!-- Architectural Route Grid in Warm Bronze -->
  <g opacity="0.18">
    <line x1="0" y1="120" x2="800" y2="120" stroke="#a88568" stroke-dasharray="4 4"/>
    <line x1="0" y1="240" x2="800" y2="240" stroke="#a88568" stroke-dasharray="4 4"/>
    <line x1="0" y1="360" x2="800" y2="360" stroke="#a88568" stroke-dasharray="4 4"/>
    <line x1="200" y1="0" x2="200" y2="500" stroke="#a88568" stroke-dasharray="4 4"/>
    <line x1="400" y1="0" x2="400" y2="500" stroke="#a88568" stroke-dasharray="4 4"/>
    <line x1="600" y1="0" x2="600" y2="500" stroke="#a88568" stroke-dasharray="4 4"/>
  </g>

  <!-- Route Line & Dispatch Waypoints -->
  <path d="M 100 340 C 240 180, 420 380, 680 160" fill="none" stroke="url(#fleet-path)" stroke-width="4.5"/>
  <circle cx="100" cy="340" r="10" fill="#d97706"/>
  <circle cx="360" cy="270" r="12" fill="#ea580c"/>
  <circle cx="680" cy="160" r="14" fill="#f59e0b"/>
  
  <!-- UI Dashboard Preview Card Overlay -->
  <rect x="80" y="80" width="340" height="90" rx="12" fill="#241912" fill-opacity="0.9" stroke="#d97706" stroke-opacity="0.45" stroke-width="1.5"/>
  <text x="105" y="115" fill="#fef3c7" font-family="sans-serif" font-size="16" font-weight="700">FLEET SITE LOGISTIC SYSTEM</text>
  <text x="105" y="142" fill="#d4a373" font-family="monospace" font-size="12">STATUS: REAL-TIME DISPATCH ACTIVE</text>
  
  <rect x="520" y="320" width="200" height="60" rx="8" fill="#241912" fill-opacity="0.9" stroke="#ea580c" stroke-opacity="0.45" stroke-width="1"/>
  <text x="540" y="355" fill="#f59e0b" font-family="monospace" font-size="12" font-weight="600">POSTGRESQL • AI PROTOTYPING</text>
</svg>
