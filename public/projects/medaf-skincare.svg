<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 509 200" width="100%" height="100%">
  <!-- Solid Clean Background matching CRM and Workspace -->
  <rect width="509" height="200" fill="#f7f8fa"/>

  <!-- Emerald Rounded Icon Badge matching CRM & SD style -->
  <rect x="223.5" y="30" width="62" height="62" rx="16" fill="#059669"/>

  <!-- Simple Friendly Bot SVG -->
  <g transform="translate(254.5, 61)">
    <!-- Antenna -->
    <circle cx="0" cy="-15" r="2.8" fill="#ffffff"/>
    <line x1="0" y1="-12" x2="0" y2="-8" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Ears / Side Bolts -->
    <rect x="-19.5" y="-1" width="3" height="7" rx="1.5" fill="#ffffff"/>
    <rect x="16.5" y="-1" width="3" height="7" rx="1.5" fill="#ffffff"/>

    <!-- Bot Head (Solid White) -->
    <rect x="-16" y="-8" width="32" height="24" rx="6" fill="#ffffff"/>

    <!-- Eyes (Emerald cut-out) -->
    <circle cx="-6.5" cy="2" r="2.6" fill="#059669"/>
    <circle cx="6.5" cy="2" r="2.6" fill="#059669"/>

    <!-- Smile (Emerald curve) -->
    <path d="M -5 8 Q 0 11.5 5 8" fill="none" stroke="#059669" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- Title 'Medaf Skincare Platform' in matching Emerald -->
  <text x="254.5" y="128" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#059669" letter-spacing="-0.3">Medaf Skincare Platform</text>
</svg>
