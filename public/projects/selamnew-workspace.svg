    <line x1="0" y1="200" x2="800" y2="200" stroke="#d4a373" stroke-dasharray="3 3"/>
    <line x1="0" y1="300" x2="800" y2="300" stroke="#d4a373" stroke-dasharray="3 3"/>
    <line x1="0" y1="400" x2="800" y2="400" stroke="#d4a373" stroke-dasharray="3 3"/>
    <line x1="200" y1="0" x2="200" y2="500" stroke="#d4a373" stroke-dasharray="3 3"/>
    <line x1="400" y1="0" x2="400" y2="500" stroke="#d4a373" stroke-dasharray="3 3"/>
    <line x1="600" y1="0" x2="600" y2="500" stroke="#d4a373" stroke-dasharray="3 3"/>
