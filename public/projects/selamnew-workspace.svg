      <text x="22" y="87" fill="#f5c29f" font-family="monospace" font-size="7">PLANNED</text>

      <rect x="10" y="106" width="125" height="58" rx="6" fill="#1b140f" stroke="#52392b" stroke-width="1"/>
      <text x="18" y="124" fill="#f0ebe6" font-family="sans-serif" font-size="10" font-weight="600">Cross-team Sharing</text>
      <text x="18" y="140" fill="#8c786a" font-family="monospace" font-size="8">PO: WONGEL • P2</text>

