<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="ws-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181310"/>
      <stop offset="50%" stop-color="#241b14"/>
      <stop offset="100%" stop-color="#120e0b"/>
    </linearGradient>
    <radialGradient id="ws-glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#c2632b" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#c2632b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c2632b"/>
      <stop offset="100%" stop-color="#e08244"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#ws-bg)"/>
  <rect width="800" height="500" fill="url(#ws-glow)"/>

  <!-- Subtle Blueprint Grid -->
  <g opacity="0.12">
