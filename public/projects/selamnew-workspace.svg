      <rect x="320" y="0" width="145" height="290" rx="8" fill="#241b15" stroke="#3d2d22" stroke-width="1"/>
      <text x="334" y="24" fill="#34d399" font-family="monospace" font-size="10" font-weight="700">SHIPPED &amp; LIVE</text>
      <rect x="330" y="38" width="125" height="58" rx="6" fill="#1b140f" stroke="#2a4533" stroke-width="1"/>
      <text x="338" y="56" fill="#f0ebe6" font-family="sans-serif" font-size="10" font-weight="600">Enterprise Role RBAC</text>
      <text x="338" y="72" fill="#8c786a" font-family="monospace" font-size="8">100% ADOPTION</text>
      
      <rect x="330" y="106" width="125" height="58" rx="6" fill="#1b140f" stroke="#2a4533" stroke-width="1"/>
      <text x="338" y="124" fill="#f0ebe6" font-family="sans-serif" font-size="10" font-weight="600">Real-time Collab WS</text>
      <text x="338" y="140" fill="#8c786a" font-family="monospace" font-size="8">VERIFIED 2024</text>
