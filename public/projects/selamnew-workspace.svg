      <text x="178" y="56" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="700">Doc Version Control</text>
      <text x="178" y="72" fill="#d4a373" font-family="monospace" font-size="8">SPRINT 14 • 8 PTS</text>
      <rect x="178" y="80" width="60" height="14" rx="2" fill="#10b981" fill-opacity="0.25"/>
      <text x="183" y="90" fill="#34d399" font-family="monospace" font-size="8">UAT ACTIVE</text>

