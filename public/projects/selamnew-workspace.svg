    <text x="26" y="72" fill="#f5c29f" font-family="sans-serif" font-size="11" font-weight="700">★ IE Net Spaces</text>
    
    <text x="26" y="112" fill="#998375" font-family="monospace" font-size="10">CHANNELS</text>
